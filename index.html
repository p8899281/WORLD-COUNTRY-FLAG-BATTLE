<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Country Flag Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-title">🌍 WORLD COUNTRY FLAG BATTLE</div>
        <div class="brand-sub">Automated Tournament • Live Arena • YouTube Ready</div>
      </div>
      <div class="status-row">
        <div class="pill">STAGE: <span id="stageText">QUALIFYING</span></div>
        <div class="pill">ROUND: <span id="roundText">1</span></div>
        <div class="pill">ACTIVE FLAGS: <span id="activeText">250</span></div>
      </div>
    </header>

    <main class="layout">
      <section class="arena-panel glass">
        <div class="arena-head">
          <div id="announcement" class="announcement">Press START to begin the tournament.</div>
          <div class="mini-stats">
            <span id="speedLabel">×1</span>
            <span id="autoLabel">AUTO ON</span>
          </div>
        </div>

        <div class="arena-wrap">
          <canvas id="arena"></canvas>
          <div id="overlayStage" class="overlay-stage hidden"></div>
          <div id="overlayWinner" class="overlay-winner hidden">
            <div class="winner-kicker">🏆 WORLD CHAMPION 🏆</div>
            <div class="winner-flag" id="winnerFlag">🏳️</div>
            <div class="winner-name" id="winnerName">Country</div>
          </div>
        </div>

        <div class="bottom-tracker">
          <div class="tracker-head">
            <div id="trackerCount">250 / 250 FLAGS</div>
            <div class="tracker-right">Tournament Tracker</div>
          </div>
          <div id="flagGrid" class="flag-grid"></div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="glass panel controls">
          <h2>Controls</h2>
          <div class="btn-row">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="resumeBtn">RESUME</button>
          </div>
          <div class="btn-row">
            <button id="restartBtn">RESTART</button>
            <button id="fsBtn">FULLSCREEN</button>
          </div>
          <div class="toggle-grid">
            <label><input type="checkbox" id="autoMode" checked> AUTO MODE</label>
            <label><input type="checkbox" id="soundOn" checked> SOUND ON</label>
            <label><input type="checkbox" id="voiceOn" checked> VOICE ON</label>
            <label><input type="checkbox" id="musicOn" checked> MUSIC ON</label>
          </div>

          <div class="slider-box">
            <div class="slider-head"><span>MASTER VOLUME</span><span id="volumeVal">70%</span></div>
            <input type="range" id="volume" min="0" max="100" value="70" />
          </div>

          <div class="slider-box">
            <div class="slider-head"><span>SPEED</span><span id="speedVal">×1</span></div>
            <div class="speed-row">
              <button class="speedBtn active" data-speed="1">×1</button>
              <button class="speedBtn" data-speed="2">×2</button>
              <button class="speedBtn" data-speed="4">×4</button>
            </div>
          </div>
        </section>

        <section class="glass panel settings">
          <h2>Settings</h2>
          <div class="setting">
            <label for="flagCount">Number of flags</label>
            <select id="flagCount">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="150">150</option>
              <option value="200">200</option>
              <option value="250" selected>250</option>
            </select>
          </div>
          <div class="setting">
            <label for="battleSpeed">Battle speed</label>
            <select id="battleSpeed">
              <option value="slow">Slow</option>
              <option value="normal" selected>Normal</option>
              <option value="fast">Fast</option>
            </select>
          </div>
          <div class="setting">
            <label for="collisionIntensity">Collision intensity</label>
            <select id="collisionIntensity">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </div>
        </section>

        <section class="glass panel leaderboard">
          <h2>Leaderboard</h2>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
