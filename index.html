<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flags Battle Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Mode Selection Screen -->
  <div id="mode-selector" class="overlay-screen">
    <div class="mode-box">
      <h2>SELECT DEVICE MODE</h2>
      <div class="mode-btns">
        <button onclick="startGame('mobile')">📱 MOBILE MODE</button>
        <button onclick="startGame('pc')">💻 PC MODE</button>
      </div>
    </div>
  </div>

  <!-- Main Game UI (Hidden initially) -->
  <div id="app" class="hidden">
    <header class="top-header">
      <div class="title">250-EXTENDED FLAGS BATTLE</div>
      <div class="subtitle">ROUND <span id="roundText">1</span> ⏱ <span id="timerText">00:00</span> · QUALIFYING</div>
    </header>

    <div class="qualified-board">
      <div class="board-title">QUALIFIED FOR FINAL</div>
      <div class="board-list" id="qualifiedList">
        <!-- Ranks will appear here -->
      </div>
    </div>

    <div class="arena-info">
      <span class="mod-text">[ NEW MOD ]</span>
      <span class="qualifying-text">QUALIFYING · <span id="timeText2">00:00</span></span>
    </div>

    <div class="arena-container">
      <canvas id="arena"></canvas>
      <div id="winnerOverlay" class="winner-overlay hidden">
        <div class="round-winner-text">ROUND WINNER</div>
        <div class="winner-flag-box" id="winnerFlagBox">🏳️</div>
        <div class="winner-name" id="winnerName">Country</div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-text"><span id="activeCount">250</span> / 250 FLAGS</div>
    </div>

    <div class="flag-grid" id="flagGrid">
      <!-- Flags will be generated here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
