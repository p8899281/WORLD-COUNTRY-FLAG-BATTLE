<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>193 World Flags Battle Pro</title>
  
  <!-- CSS এখানেই যোগ করা হয়েছে -->
  <style>
    :root {
      --bg-color: #03140b;
      --theme-green: #00ff66;
      --theme-yellow: #ffd23f;
      --theme-blue: #00d2ff;
      --text-main: #ffffff;
      --board-bg: #062817;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #000; color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    .overlay-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .mode-box { background: var(--board-bg); border: 2px solid var(--theme-green); padding: 30px; border-radius: 12px; text-align: center; }
    .mode-box h2 { margin-bottom: 20px; color: var(--theme-green); }
    .mode-btns { display: flex; gap: 15px; justify-content: center; }
    .mode-btns button { padding: 15px 25px; font-size: 16px; font-weight: bold; background: #004d26; color: white; border: 1px solid var(--theme-green); border-radius: 8px; cursor: pointer; }
    .mode-btns button:hover { background: var(--theme-green); color: black; }
    .hidden { display: none !important; }

    #app { background-color: var(--bg-color); width: 100%; display: flex; flex-direction: column; padding: 10px; transition: all 0.3s; position: relative; }
    body.mobile-mode #app { max-width: 480px; border-left: 2px solid #111; border-right: 2px solid #111; }
    body.pc-mode #app { max-width: 900px; padding: 20px; border-radius: 12px; border: 1px solid var(--theme-green); margin: auto; height: 95vh; }

    .top-header { text-align: center; margin-bottom: 8px; }
    .title { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff;}
    .subtitle { font-size: 14px; color: var(--theme-yellow); font-weight: bold; margin-top: 4px; }

    .qualified-board { background: var(--board-bg); border: 2px solid #005a30; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
    .board-title { text-align: center; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; }
    .board-list { display: flex; flex-direction: column; gap: 4px; }
    .board-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; background: rgba(0,255,102,0.1); padding: 4px 8px; border-radius: 4px; }
    .rank { color: var(--theme-green); width: 30px; }
    .win-count { color: var(--theme-yellow); }

    .arena-info { display: flex; justify-content: space-between; font-size: 12px; color: #888; font-weight: bold; padding: 0 10px; margin-bottom: 4px; }
    .qualifying-text { color: #ff5555; }

    .arena-container { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 360px; overflow: hidden; }
    canvas { width: 100%; height: 100%; max-height: 560px; object-fit: contain; }

    .winner-overlay { position: absolute; text-align: center; background: rgba(0,0,0,0.85); inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; z-index: 10; }
    .round-winner-text { color: var(--theme-yellow); font-size: 24px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,210,63,0.8); }
    .winner-flag-box { font-size: 80px; box-shadow: 0 0 30px rgba(255,255,255,0.3); background: #000; padding: 10px; margin: 10px 0; border-radius: 10px; }
    .winner-name { font-size: 28px; font-weight: bold; margin-top: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

    /* 🟡 প্রোগ্রেস বার (স্ক্রিনশটের মতো লম্বা কালো ব্যাকগ্রাউন্ড এবং হলুদ ফিলিং) */
    .yellow-tracker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      width: 100%;
    }

    .yellow-track-bg {
      width: 80%;
      max-width: 450px;
      height: 8px;
      background: #1a2f22; /* কালো/গাঢ় সবুজ ট্র্যাক */
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 102, 0.2);
    }

    .yellow-track-fill {
      height: 100%;
      width: 100%; /* JS থেকে এটা কমবে */
      background: #ffd23f;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(255, 210, 63, 0.8);
      transition: width 0.2s ease-out; /* কমার সময় মসৃণ অ্যানিমেশন */
    }

    .tracker-text-count {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Mode Selection Screen -->
  <div id="mode-selector" class="overlay-screen">
    <div class="mode-box">
      <h2>SELECT DEVICE MODE</h2>
      <div class="mode-btns">
        <button onclick="startGame('mobile')">📱 MOBILE MODE</button>
        <button onclick="startGame('pc')">💻 PC MODE</button>
      </div>
    </div>
  </div>

  <!-- Main Game UI -->
  <div id="app" class="hidden">
    <header class="top-header">
      <div class="title">193-WORLD FLAGS BATTLE</div>
      <div class="subtitle">ROUND <span id="roundText">1</span> ⏱ <span id="timerText">00:45</span> · QUALIFYING</div>
    </header>

    <div class="qualified-board">
      <div class="board-title">QUALIFIED FOR FINAL</div>
      <div class="board-list" id="qualifiedList"></div>
    </div>

    <div class="arena-info">
      <span class="mod-text">[ ASMR SOUND ENABLED ]</span>
      <span class="qualifying-text">TIME LEFT: <span id="timeText2">45s</span></span>
    </div>

    <div class="arena-container">
      <canvas id="arena"></canvas>
      <div id="winnerOverlay" class="winner-overlay hidden">
        <div class="round-winner-text">ROUND WINNER</div>
        <div class="winner-flag-box" id="winnerFlagBox">🏳️</div>
        <div class="winner-name" id="winnerName">Country</div>
      </div>
    </div>

    <!-- 💛 গোল করা প্রোগ্রেস বার অংশটি -->
    <div class="yellow-tracker-container">
      <div class="yellow-track-bg">
        <div class="yellow-track-fill" id="progressBar"></div>
      </div>
      <div class="tracker-text-count"><span id="activeCount">193</span> / 193 FLAGS</div>
    </div>
  </div>

  <!-- JS এখানেই যোগ করা হয়েছে -->
  <script>
    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");

    const els = {
      app: document.getElementById("app"),
      modeSelector: document.getElementById("mode-selector"),
      activeCount: document.getElementById("activeCount"),
      progressBar: document.getElementById("progressBar"),
      winnerOverlay: document.getElementById("winnerOverlay"),
      winnerName: document.getElementById("winnerName"),
      winnerFlagBox: document.getElementById("winnerFlagBox"),
      qualifiedList: document.getElementById("qualifiedList"),
      timerText: document.getElementById("timerText"),
      timeText2: document.getElementById("timeText2")
    };

    let TOTAL_FLAGS = 193; 
    let flags = [];
    let activeFlags = [];
    let deadFlags = [];

    let whiteAngle = 0;       
    let yellowAngle = 0;      

    const gapSize = Math.PI / 3.4;     
    const yellowSize = Math.PI / 4.2;  

    const whiteSpeed = 0.018; 
    const yellowSpeed = 0.052; 

    let arenaR = 0, arenaX = 0, arenaY = 0;
    let isPlaying = false;
    let round = 1;

    let startTime = 0;
    let roundDuration = 45; 

    // Web Audio System
    let audioCtx = null;
    let lastSoundTime = 0;

    let bgmInterval = null;
    let bgmStep = 0;
    const bgmNotes = [220, 261.63, 293.66, 329.63, 392.00, 440, 523.25, 329.63]; 

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startBGM() {
      stopBGM();
      bgmStep = 0;
      bgmInterval = setInterval(() => {
        if (!audioCtx || !isPlaying) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          const freq = bgmNotes[bgmStep % bgmNotes.length];
          bgmStep++;

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          
          gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.38);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch (e) {}
      }, 220); 
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function playSound(type, intensity = 1) {
      if (!audioCtx || !isPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const nowTime = Date.now();

      try {
        if (type === "bounce") {
          if (nowTime - lastSoundTime < 30) return;
          lastSoundTime = nowTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          const basePitch = 230 + Math.random() * 40 + Math.min(intensity, 3) * 15;
          osc.type = "sine";
          
          osc.frequency.setValueAtTime(basePitch, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.035);
          
          const vol = Math.min(0.07, 0.015 + intensity * 0.008);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.045);

        } else if (type === "out") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = "sine";
          osc.frequency.setValueAtTime(280 + Math.random() * 40, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.04);
          osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.12);
          
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.13);

        } else if (type === "win") {
          stopBGM(); 
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + idx * 0.08 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.08 + 1.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.08);
            osc.stop(audioCtx.currentTime + idx * 0.08 + 1.25);
          });
        }
      } catch (e) {}
    }

    function speakWinner(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance("The winner is " + name);
        utterance.rate = 0.92;
        utterance.pitch = 1.0;
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }
    }

    const countryList = [
      ["IN","India","🇮🇳"], ["US","United States","🇺🇸"], ["GB","United Kingdom","🇬🇧"], 
      ["BD","Bangladesh","🇧🇩"], ["CM","Cameroon","🇨🇲"], ["BF","Burkina Faso","🇧🇫"],
      ["SC","Seychelles","🇸🇨"], ["MW","Malawi","🇲🇼"], ["SZ","Eswatini","🇸🇿"],
      ["BR","Brazil","🇧🇷"], ["AR","Argentina","🇦🇷"], ["FR","France","🇫🇷"],
      ["DE","Germany","🇩🇪"], ["JP","Japan","🇯🇵"], ["KR","South Korea","🇰🇷"],
      ["CA","Canada","🇨🇦"], ["AU","Australia","🇦🇺"], ["IT","Italy","🇮🇹"],
      ["ES","Spain","🇪🇸"], ["PT","Portugal","🇵🇹"], ["RU","Russia","🇷🇺"],
      ["CN","China","🇨🇳"], ["ZA","South Africa","🇿🇦"], ["MX","Mexico","🇲🇽"],
      ["EG","Egypt","🇪🇬"], ["NG","Nigeria","🇳🇬"], ["PK","Pakistan","🇵🇰"]
    ];
    while(countryList.length < TOTAL_FLAGS) {
        countryList.push(countryList[Math.floor(Math.random() * countryList.length)]);
    }

    function startGame(mode) {
      unlockAudio();
      document.body.classList.add(mode + '-mode');
      els.modeSelector.classList.add("hidden");
      els.app.classList.remove("hidden");
      
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      
      initGame();
      isPlaying = true;
      startBGM(); 
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      arenaX = canvas.width / 2;
      arenaY = canvas.height / 2 - 40;
      arenaR = Math.min(arenaX, arenaY) - 25; 
    }

    function initGame() {
      flags = [];
      deadFlags = [];
      startTime = Date.now();
      
      for (let i = 0; i < TOTAL_FLAGS; i++) {
        let country = countryList[i];
        let flagObj = {
          id: i, code: country[0], name: country[1], emoji: country[2],
          x: arenaX + (Math.random() - 0.5) * (arenaR * 0.8),
          y: arenaY + (Math.random() - 0.5) * (arenaR * 0.8),
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
          r: 9, active: true, settled: false, targetX: 0, targetY: 0
        };
        flags.push(flagObj);
      }
      activeFlags = [...flags];
      updateUI();
      updateLeaderboard();
    }

    function normalizeAngle(a) {
      while (a < 0) a += Math.PI * 2;
      while (a >= Math.PI * 2) a -= Math.PI * 2;
      return a;
    }

    function isAngleBetween(target, start, end) {
      if (start < end) return target >= start && target <= end;
      return target >= start || target <= end;
    }

    function eliminate(flag) {
      if (!flag.active) return;
      flag.active = false;
      playSound("out");
      
      activeFlags = activeFlags.filter(f => f.id !== flag.id);
      
      const slotIndex = deadFlags.length;
      const itemWidth = 22;
      const itemsPerRow = Math.max(10, Math.floor((canvas.width - 20) / itemWidth));
      const col = slotIndex % itemsPerRow;
      const row = Math.floor(slotIndex / itemsPerRow);
      
      const startX = (canvas.width - (itemsPerRow * itemWidth)) / 2 + 11;
      flag.targetX = startX + col * itemWidth;
      flag.targetY = canvas.height - 12 - (row * 18);
      flag.settled = false;

      deadFlags.push(flag); 
      updateUI();
      
      if (activeFlags.length === 1) {
          declareWinner(activeFlags[0]);
      }
    }

    function declareWinner(flag) {
        if (!isPlaying) return;
        isPlaying = false;
        playSound("win");
        speakWinner(flag.name);
        
        els.winnerOverlay.classList.remove("hidden");
        els.winnerFlagBox.innerText = flag.emoji;
        els.winnerName.innerText = flag.name;
        
        setTimeout(() => {
            els.winnerOverlay.classList.add("hidden");
            round++;
            document.getElementById("roundText").innerText = round;
            initGame();
            isPlaying = true;
            startBGM(); 
            requestAnimationFrame(gameLoop);
        }, 5000);
    }

    // 🟡 এই ফাংশনটি তোমার হলুদ বারটি ঠিক কতটুকু চওড়া থাকবে তা নিয়ন্ত্রণ করবে
    function updateUI() {
      if (els.activeCount && els.progressBar) {
        els.activeCount.innerText = activeFlags.length;
        
        // ফ্ল্যাগের শতকরা পরিমাণ বের করে লাইনের Width (চওড়া) সেট করা
        let percentage = (activeFlags.length / TOTAL_FLAGS) * 100;
        els.progressBar.style.width = percentage + "%";
      }
    }

    function updateLeaderboard() {
        let top = countryList.slice(0, 5);
        els.qualifiedList.innerHTML = top.map((c, i) => `
            <div class="board-row">
                <span class="rank">#${i+1}</span>
                <span>${c[2]} ${c[1]}</span>
                <span class="win-count">1 win</span>
            </div>
        `).join("");
    }

    function bounceFlag(f, dx, dy, dist) {
      let nx = dx / dist;
      let ny = dy / dist;
      
      let dot = (f.vx * nx) + (f.vy * ny);
      
      if (dot > 0) {
        f.x = arenaX + nx * (arenaR - f.r);
        f.y = arenaY + ny * (arenaR - f.r);
        
        f.vx -= 2 * dot * nx;
        f.vy -= 2 * dot * ny;
        
        const speed = Math.abs(dot);
        if (speed > 0.8) {
          playSound("bounce", speed);
        }
      }
    }

    function gameLoop() {
      if (!isPlaying) return;
      
      let elapsed = (Date.now() - startTime) / 1000;
      let timeLeft = Math.max(0, roundDuration - elapsed);
      
      let mins = Math.floor(timeLeft / 60);
      let secs = Math.floor(timeLeft % 60);
      els.timerText.innerText = `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
      els.timeText2.innerText = `${Math.floor(timeLeft)}s`;

      let progress = Math.min(1, elapsed / roundDuration);
      
      let targetCount = Math.max(1, Math.floor(TOTAL_FLAGS * (1 - Math.pow(progress, 0.75))));
      let pressureMult = activeFlags.length > targetCount ? 1.0 + (activeFlags.length - targetCount) * 0.08 : 1.0;
      
      let speedMult = (1.2 + progress * 2.2) * pressureMult; 
      
      whiteAngle = normalizeAngle(whiteAngle + whiteSpeed);
      yellowAngle = normalizeAngle(yellowAngle + yellowSpeed);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let gStart = whiteAngle;
      let gEnd = normalizeAngle(whiteAngle + gapSize);
      
      let yStart = yellowAngle;
      let yEnd = normalizeAngle(yellowAngle + yellowSize);

      for (let f of [...activeFlags]) {
        let dx = f.x - arenaX;
        let dy = f.y - arenaY;
        let dist = Math.hypot(dx, dy) || 1;
        
        if (dist < arenaR * 0.6) {
            f.vx += (dx / dist) * 0.2 * pressureMult;
            f.vy += (dy / dist) * 0.2 * pressureMult;
        }

        f.x += f.vx * (speedMult * 0.35);
        f.y += f.vy * (speedMult * 0.35);
        
        if (dist > arenaR - f.r) {
          let fAngle = normalizeAngle(Math.atan2(dy, dx));
          
          let inGap = isAngleBetween(fAngle, gStart, gEnd);

          if (inGap) {
              let inYellow = isAngleBetween(fAngle, yStart, yEnd);
              
              if (inYellow) {
                  bounceFlag(f, dx, dy, dist); 
              } else {
                  if (dist > arenaR + 6) { eliminate(f); }
              }
          } else {
              bounceFlag(f, dx, dy, dist);
          }
        }
      }

      for (let f of deadFlags) {
          if (!f.settled) {
              f.vy += 0.4;
              f.x += (f.targetX - f.x) * 0.12;
              f.y += f.vy;
              
              if (f.y >= f.targetY) {
                  f.y = f.targetY;
                  f.x = f.targetX;
                  f.settled = true;
                  f.vx = 0;
                  f.vy = 0;
              }
          }
      }

      ctx.beginPath();
      ctx.arc(arenaX, arenaY, arenaR, gEnd, gStart);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(arenaX, arenaY, arenaR, yStart, yEnd);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#00d2ff";
      ctx.shadowBlur = 14;
      ctx.shadowColor = "#00d2ff";
      ctx.stroke();
      ctx.shadowBlur = 0; 

      ctx.font = "16px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.globalAlpha = 1.0; 
      for (let f of deadFlags) {
          ctx.fillText(f.emoji, f.x, f.y);
      }

      ctx.font = "22px Arial";
      for (let f of activeFlags) {
          ctx.fillText(f.emoji, f.x, f.y);
      }
      
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("click", unlockAudio);
    document.addEventListener("touchstart", unlockAudio);
  </script>
</body>
</html>
