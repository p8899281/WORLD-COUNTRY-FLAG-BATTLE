<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>193 World Flags Battle HD Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Mode Selection Screen -->
  <div id="mode-selector" class="overlay-screen">
    <div class="mode-box">
      <h2>SELECT DEVICE MODE</h2>
      <div class="mode-btns">
        <button onclick="selectMode('mobile')">📱 MOBILE MODE</button>
        <button onclick="selectMode('pc')">💻 PC MODE</button>
      </div>
    </div>
  </div>

  <!-- Start Battle Screen with Fullscreen Option -->
  <div id="start-screen" class="overlay-screen hidden">
    <div class="start-box">
      <div class="start-flags-row">🇺🇸 🇧🇷 🇯🇵 🇫🇷 🇰🇷 🇩🇪 🇦🇷</div>
      <h1 class="start-title">COUNTRY FLAGS BATTLE</h1>
      <div class="start-underline"></div>
      
      <!-- 🖥️ ফুল স্ক্রিন অপশন -->
      <label class="fullscreen-option">
        <input type="checkbox" id="fullscreenToggle" checked />
        <span>🖥️ Launch in Fullscreen</span>
      </label>

      <button class="start-battle-btn" onclick="beginBattle()">
        <span class="play-icon">▶</span> START THE BATTLE
      </button>

      <div class="start-footer-text">193+ FLAGS · LAST FLAG STANDING WINS</div>
    </div>
  </div>

  <!-- Main Game UI -->
  <div id="app" class="hidden">
    <header class="top-header">
      <div class="title">193-WORLD FLAGS BATTLE</div>
      <div class="subtitle">ROUND <span id="roundText">1</span> ⏱ <span id="timerText">00:45</span> · QUALIFYING</div>
    </header>

    <div class="qualified-board">
      <div class="board-title">QUALIFIED FOR FINAL</div>
      <div class="board-list" id="qualifiedList"></div>
    </div>

    <div class="arena-container">
      <canvas id="arena"></canvas>
      <div id="winnerOverlay" class="winner-overlay hidden">
        <div class="round-winner-text">ROUND WINNER</div>
        <div class="winner-flag-box" id="winnerFlagBox">🏳️</div>
        <div class="winner-name" id="winnerName">Country</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
